<html>
<!-- <html manifest="cache.appcache"> -->

<head>
    <title>Shit Jailbreak</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="main.css">

    <!-- VISUAL ONLY — nothing structural, no ID/class/script changes -->
    <style>

        /* Background */
        body {
            background: #020617;
            background-image:
                -webkit-radial-gradient(top left circle, #1e3a8a, transparent 40%),
                -webkit-radial-gradient(bottom right circle, #7c3aed, transparent 40%);
            background-image:
                radial-gradient(circle at top left,     #1e3a8a, transparent 40%),
                radial-gradient(circle at bottom right, #7c3aed, transparent 40%);
            color: white;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
        }

        /* Header */
        h1 {
            font-size: 2rem;
            font-weight: 700;
            background: -webkit-linear-gradient(left, #38bdf8, #a78bfa);
            background:          linear-gradient(90deg, #38bdf8, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: #38bdf8; /* plain fallback */
            margin-bottom: 6px;
        }

        #top-bar-text { color: #cbd5e1; }
        #current-fw   { color: #38bdf8; }

        /* ── Buttons ──
           Restyled as dark cards. max-width + auto margins centre them
           inside whatever flex layout main.css provides.
           margin-bottom on #run-jb creates the gap (gap: property
           is unreliable on PS5 WebKit).
        ── */
        .btn {
            display: block;
            width: 100%;
            max-width: 520px;
            margin-left:  auto;
            margin-right: auto;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 26px 32px !important;
            font-size: 1.1rem !important;
            color: white;
            text-decoration: none;
            cursor: pointer;
            text-align: left;
            position: relative;
            overflow: hidden;
            -webkit-transition: border-color .25s, -webkit-transform .25s, box-shadow .25s;
                    transition: border-color .25s,         transform .25s, box-shadow .25s;
        }

        .btn:hover {
            border-color: rgba(56, 189, 248, .7);
            -webkit-transform: translateY(-4px);
                    transform: translateY(-4px);
            box-shadow: 0 16px 32px rgba(0, 0, 0, .45);
        }

        /* Shimmer on hover — no GPU blur needed */
        .btn::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: -webkit-linear-gradient(left, transparent, rgba(255,255,255,.08), transparent);
            background:          linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);
            -webkit-transform: translateX(-100%);
                    transform: translateX(-100%);
            -webkit-transition: -webkit-transform .5s;
                    transition:         transform .5s;
        }
        .btn:hover::before {
            -webkit-transform: translateX(100%);
                    transform: translateX(100%);
        }

        /* Gap between the two buttons */
        #run-jb {
            margin-bottom: 28px;
            font-size: 1.25rem !important;
            font-weight: 700;
        }

        /* Badge spans appended by JS below */
        .sjb-badge {
            display: inline-block;
            margin-top: 14px;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: .75rem;
            font-weight: 600;
        }
        .sjb-badge.not-jb {
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.2);
            color: #94a3b8;
        }
        .sjb-badge.jailbroken {
            background: #38bdf8;
            color: #020617;
        }
        .sjb-badge.waiting {
            background: rgba(251, 191, 36, .12);
            border: 1px solid rgba(251, 191, 36, .35);
            color: #fbbf24;
        }
        .sjb-badge.ready {
            background: #22c55e;
            color: white;
        }

        /* Console */
        #console {
            background: #020617;
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 16px;
            padding: 20px;
            font-family: "Courier New", Courier, monospace;
            font-size: .82rem;
            line-height: 1.6;
            color: #94a3b8;
            min-height: 280px;
            max-height: 50vh;
            overflow-y: auto;
        }
        #console * { color: inherit; }

        /* Footer */
        .text-secondary       { color: #475569 !important; }
        .text-secondary a     { color: #a78bfa; text-decoration: none; }
        .text-secondary a:hover { color: #c4b5fd; }

        /* L2 pill */
        .l2-redirect-box {
            background: -webkit-linear-gradient(left, #38bdf8, #a78bfa);
            background:          linear-gradient(90deg, #38bdf8, #a78bfa);
            color: white;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: .8rem;
        }

    </style>
</head>

<!-- body is set up as three rows: auto 1fr auto -->
<body>
    <!-- Row 1 -->
    <div class="p-2">
        <h1 class="text-center">SJB-umtx2 PS5 (1.xx-5.xx)</h1>
        <p class="text-center" id="top-bar-text">Firmware Version: <span class="fw-bold" id="current-fw"></span></p>

        <!-- This is absolute positioned to the body-->
        <div id="toast-container"></div>
    </div>

    <!-- Row 2 -->
    <div id="main-content">
        <div id="pre-jb-view" class="d-flex align-items-center justify-content-center flex-direction-column selected">
            <a tabindex="0" class="btn fw-bold" id="run-jb" onclick="run()">Jailbreak</a>
            <a tabindex="0" class="btn" style="padding: 0.5rem 2rem; font-size: 1rem;" id="run-wk-only"
                onclick="run(true)">Payload Injector (Must Be Jailbroken)</a>
        </div>

        <div id="console-view">
            <div id="console" class="log"></div>
        </div>

        <div id="payloads-view">
        </div>
    </div>

    <!-- Row 3 -->
    <div class="position-relative text-center p-2 mb-2">
        <p class="text-secondary" id="version">v1.0</p>
        <p class="text-secondary">Credit</p>
        <h3 class="text-secondary mt-2">
            <a href="https://github.com/StaticM223">StaticM223/StaticMdz</a>,
        </h3>

        <div class="position-absolute d-flex align-items-center bottom-0 left-0 m-4">
            <div class="l2-redirect-box">L2</div>
            <span class="ml-2">Redirect</span>
        </div>
    </div>

    <script src="int64.js"></script>
    <script src="rop.js"></script>
    <script src="main.js"></script>
    <script src="umtx2.js"></script>
    <script src="custom_host_stuff.js"></script>
    <script src="syscalls.js"></script>
    <script type="module" src="psfree/psfree.js"></script>
    <script src="payload_map.js"></script>

    <script>
        addEventListener('unhandledrejection', (event) => {
            const reason = event.reason;
            // We log the line and column numbers as well since some exceptions (like
            // SyntaxError) do not show it in the stack trace.
            alert(
                `${reason}\n`
                + `${reason.sourceURL}:${reason.line}:${reason.column}\n`
                + `${reason.stack}`
            );
            throw reason;
        });
        document.getElementById("current-fw").innerHTML = fw_str;
        registerAppCacheEventHandlers();
        registerL2ButtonHandler();
        window.onload = function () {
            let autoload = sessionStorage.getItem(SESSIONSTORE_ON_LOAD_AUTORUN_KEY);
            if (autoload) {
                run(autoload == "wkonly", false);
            }
        };
    </script>

    <!-- Status badges + jailbreak detection — appended after originals, touches nothing above -->
    <script>
        // Append badge spans below each button
        var jbBtn = document.getElementById('run-jb');
        var jbBadge = document.createElement('span');
        jbBadge.className = 'sjb-badge not-jb';
        jbBadge.id = 'jb-status-badge';
        jbBadge.textContent = 'Not Jailbroken';
        jbBtn.appendChild(jbBadge);

        var plBtn = document.getElementById('run-wk-only');
        var plBadge = document.createElement('span');
        plBadge.className = 'sjb-badge waiting';
        plBadge.id = 'inject-status-badge';
        plBadge.textContent = 'Waiting for Jailbreak';
        plBtn.appendChild(plBadge);

        function markJailbroken() {
            var b1 = document.getElementById('jb-status-badge');
            if (b1) { b1.textContent = 'Jailbroken'; b1.className = 'sjb-badge jailbroken'; }
            var b2 = document.getElementById('inject-status-badge');
            if (b2) { b2.textContent = 'Ready to Inject'; b2.className = 'sjb-badge ready'; }
        }

        // Watch #console for the "done" keyword
        var _con = document.getElementById('console');
        var _obs = new MutationObserver(function() {
            var t = _con.textContent ? _con.textContent.toLowerCase() : '';
            if (t.indexOf('done') !== -1) { markJailbroken(); }
        });
        _obs.observe(_con, { childList: true, subtree: true, characterData: true });
    </script>

</body>

</html>
