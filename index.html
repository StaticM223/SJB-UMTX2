<!DOCTYPE html>
<html>
<!-- <html manifest="cache.appcache"> -->

<head>
    <title>Shit Jailbreak</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="main.css">

    <!-- VISUAL ONLY — nothing structural, no ID/class/script changes -->
    <style>

        /* Background */
        body {
            background: #020617;
            background-image:
                -webkit-radial-gradient(top left circle, #1e3a8a, transparent 40%),
                -webkit-radial-gradient(bottom right circle, #7c3aed, transparent 40%);
            background-image:
                radial-gradient(circle at top left,     #1e3a8a, transparent 40%),
                radial-gradient(circle at bottom right, #7c3aed, transparent 40%);
            color: white;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
        }

        /* Header */
        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: -webkit-linear-gradient(left, #38bdf8, #a78bfa);
            background:          linear-gradient(90deg, #38bdf8, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: #38bdf8; /* plain fallback */
            margin-bottom: 6px;
        }

        #top-bar-text { color: #cbd5e1; }
        #current-fw   { color: #38bdf8; }

        /* ── Main Action Buttons ── */
        .btn {
            display: flex !important;
            flex-direction: column !important;
            align-items: flex-start !important;
            justify-content: center !important;
            width: 100%;
            max-width: 600px;
            height: auto !important;
            min-height: auto !important;
            margin-left:  auto;
            margin-right: auto;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 18px;
            padding: 38px 36px !important;
            font-size: 1.35rem !important;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff !important;
            text-decoration: none;
            cursor: pointer;
            text-align: left !important;
            position: relative;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            -webkit-transition: border-color .25s, -webkit-transform .25s, box-shadow .25s;
                    transition: border-color .25s,         transform .25s, box-shadow .25s;
        }

        /* Center pre-jb action buttons specifically */
        #pre-jb-view .btn {
            align-items: center !important;
            text-align: center !important;
        }

        /* Prevent main.css from making text dark on hover or focus */
        .btn:hover,
        .btn:focus,
        .btn:active,
        .btn *:hover,
        .btn *:focus {
            color: #ffffff !important;
        }

        .btn:hover {
            border-color: rgba(56, 189, 248, 0.8);
            -webkit-transform: translateY(-4px);
                    transform: translateY(-4px);
            box-shadow: 0 18px 36px -10px rgba(56, 189, 248, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        /* Spacing between primary buttons in pre-jb view */
        #pre-jb-view .btn:not(:last-child) {
            margin-bottom: 24px;
        }

        /* Console View */
        #console {
            background: #020617;
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 16px;
            padding: 20px;
            font-family: "Courier New", Courier, monospace;
            font-size: .82rem;
            line-height: 1.6;
            color: #94a3b8;
            min-height: 280px;
            max-height: 50vh;
            overflow-y: auto;
        }
        #console * { color: inherit; }

        /* Payload Injector View & Layout Centering */
        #payloads-view {
            max-height: 65vh;
            overflow-y: auto;
            padding: 10px;
            display: grid !important;
            grid-template-columns: repeat(2, minmax(0, 380px));
            justify-content: center;
            gap: 16px 20px;
            width: 100%;
            margin: 0 auto;
        }

        /* Compact Payload Buttons & Left-aligned Layout */
        #payloads-view .btn,
        #payloads-view button,
        #payloads-view a {
            width: 100% !important;
            max-width: 100% !important;
            padding: 16px 20px !important;
            font-size: 0.9rem !important;
            height: auto !important;
            min-height: auto !important;
            max-height: none !important;
            line-height: 1.4 !important;
            overflow: visible !important;
            white-space: normal !important;
            margin: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: flex-start !important;
            text-align: left !important;
            color: #ffffff !important;
        }

        /* Ensure all text nodes inside payload buttons stay light */
        #payloads-view .btn *,
        #payloads-view button *,
        #payloads-view a * {
            color: #cbd5e1 !important;
            text-align: left !important;
        }

        #payloads-view .btn b,
        #payloads-view .btn strong,
        #payloads-view .btn h1,
        #payloads-view .btn h2,
        #payloads-view .btn h3,
        #payloads-view .btn h4 {
            color: #ffffff !important;
        }

        /* Footer */
        .text-secondary       { color: #475569 !important; }
        .text-secondary a     { color: #a78bfa; text-decoration: none; }
        .text-secondary a:hover { color: #c4b5fd; }

        /* L2 pill */
        .l2-redirect-box {
            background: -webkit-linear-gradient(left, #38bdf8, #a78bfa);
            background:          linear-gradient(90deg, #38bdf8, #a78bfa);
            color: white;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: .8rem;
        }

    </style>
</head>

<!-- body is set up as three rows: auto 1fr auto -->

        </h3>

    </div>

    <script src="int64.js"></script>
    <script src="rop.js"></script>
    <script src="main.js"></script>
    <script src="umtx2.js"></script>
    <script src="custom_host_stuff.js"></script>

    <script>
        addEventListener('unhandledrejection', (event) => {
            const reason = event.reason;
            // We log the line and column numbers as well since some exceptions (like
            // SyntaxError) do not show it in the stack trace.
            alert(
                `${reason}\n`
                + `${reason.sourceURL}:${reason.line}:${reason.column}\n`
                + `${reason.stack}`
            );
            throw reason;
        });
        document.getElementById("current-fw").innerHTML = fw_str;
        registerAppCacheEventHandlers();
        registerL2ButtonHandler();
        window.onload = function () {
            let autoload = sessionStorage.getItem(SESSIONSTORE_ON_LOAD_AUTORUN_KEY);
            if (autoload) {
                run(autoload == "wkonly", false);
            }
        };
    </script>

</html>
